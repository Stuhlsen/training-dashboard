version: 2
updates:
  # Docker-Images: docker-compose.selfhost.yml/docker-compose.dev.yml (Repo-Root)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker-Images: app/Dockerfile (node/nginx)
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Docker-Images: scripts/Dockerfile (node)
  - package-ecosystem: "docker"
    directory: "/scripts"
    schedule:
      interval: "weekly"

  # Docker-Images: supabase/Dockerfile (dbmate)
  - package-ecosystem: "docker"
    directory: "/supabase"
    schedule:
      interval: "weekly"

  # npm: Repo-Root (scripts/, tests/)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm: app/ (Vite/React/TypeScript, eigenes package-lock.json)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"

  # GitHub Actions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
