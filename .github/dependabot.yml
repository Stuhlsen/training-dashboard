version: 2
updates:
  # Docker-Images: falls je ein Dockerfile/Containerfile im Repo-Root landet
  # (aktuell keins — die Dockerfiles liegen unter /app, /scripts, /supabase)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker-Compose-Images: docker-compose.selfhost.yml/docker-compose.dev.yml
  # (Repo-Root) — eigener Ecosystem-Typ, "docker" oben scannt NUR
  # Dockerfile/Containerfile, nie docker-compose*.yml (verifiziert im
  # dependabot-core-Quellcode, 23.08.2026)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker-Images: app/Dockerfile (node/nginx)
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Docker-Images: scripts/Dockerfile (node)
  - package-ecosystem: "docker"
    directory: "/scripts"
    schedule:
      interval: "weekly"

  # Docker-Images: supabase/Dockerfile (dbmate)
  - package-ecosystem: "docker"
    directory: "/supabase"
    schedule:
      interval: "weekly"

  # npm: Repo-Root (scripts/, tests/)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm: app/ (Vite/React/TypeScript, eigenes package-lock.json)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"

  # GitHub Actions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
