# CI für die React-App unter /app/ (Dashboard 3.0).
#
# Bewusst ein EIGENER Workflow statt eines Jobs in ci.yml: ci.yml testet/lintet
# den Node-Teil (scripts/, tests/) ohne npm install, /app/ braucht dagegen
# echte Dependencies (npm ci gegen app/package-lock.json) — getrennt bleibt
# ci.yml unangetastet.
#
# Committet nichts, wie ci.yml.
name: CI (App)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Anders als im Repo-Root braucht /app/ echte Dependencies (Vite, React,
      # Vitest) — deshalb npm ci gegen das versionierte package-lock.json.
      - name: Dependencies (npm ci)
        run: npm ci

      # vitest run über beide Projekte: "core" (node) und "app" (jsdom),
      # s. Kommentar in app/vite.config.ts.
      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint

      # Enthält den Typecheck (tsc -b) — deckt u.a. ab, dass die portierte
      # core-Schicht per allowJs für die TS-Seite auflösbar bleibt.
      - name: Build (tsc -b + vite build)
        run: npm run build
