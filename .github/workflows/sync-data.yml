# .github/workflows/sync-data.yml
#
# DEAKTIVIERT seit Fahrplan 3 Fenster C (Issue #31, 30.08.2026): Der Sync
# laeuft seither als Dauer-Container auf apps01 und schreibt data/*.json
# direkt ins mit dem Frontend geteilte Volume — kein Commit-und-Poll-Umweg
# mehr, data/*.json ist nicht mehr versioniert. Dieser Workflow generiert
# rides.json aus Notion (Plan 1) und intervals.icu (Plan 2) und committet
# die Daten; er bleibt nur als Rueckfahrkarte im Repo und laeuft ausschliesslich
# auf manuellen Anstoss (workflow_dispatch). Wieder scharfschalten =
# schedule/push-Trigger unten wieder eintragen UND data/*.json wieder ins Repo
# aufnehmen (Eintrag in .gitignore entfernen), sonst schlaegt der "Commit
# data"-Schritt am `git checkout origin/... -- data/...` fehl.
# Kein GitHub-Pages-Deploy (Issue #30) — Frontend selbst-gehostet ueber Docker
# (ghcr.io/stuhlsen/training-dashboard-frontend, Build in publish-images.yml).
#
# Secrets (Settings → Secrets → Actions) — Stand seit Fahrplan 7 CRED3:
#   NOTION_API_KEY / NOTION_DATABASE_ID   — Notion-Ära-Historie (nur Athlet 1)
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY — einziger Sync-Zugang; liest
#     intervals.icu-Key/-ID + grobe Koordinaten je Athlet aus athlete_sync_config
#     (scripts/lib/sync-config-fetch.js) sowie plan_cards/ftp_history/profiles.
#   SUPABASE_ANON_KEY                     — nur fuer den anonymen session_formats-Read
#   Die frueheren INTERVALS_API_KEY(_2/_4) / WEATHER_LAT/LON(_2/_4) /
#   SUPABASE_ATHLETE1/4_* / SYNC_PUSH_TOKEN sind abgeloest (Restpfad bis CRED5).

name: Sync Training Data
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # token: SYNC_PUSH_TOKEN statt des Standard-GITHUB_TOKEN (22.08.2026) —
      # main hat seit Kurzem Branch Protection (PR + Review + Status-Checks
      # Pflicht). Der Standard-Actions-Bot-Push scheiterte seitdem bei jedem
      # Lauf mit "GH006: Protected branch update failed... Changes must be
      # made through a pull request" — 3 stille Retries, dann lief der Schritt
      # trotzdem als "Erfolg" durch (kein `exit 1` nach der Retry-Schleife),
      # dadurch unbemerkt: data/*.json fror auf dem letzten erfolgreichen
      # Stand (19.08.2026) ein, s. docs/offene-punkte.md. Ein Bot-Bypass in
      # der Branch-Protection-Regel selbst (bypass_pull_request_allowances)
      # ist für persönliche (Nicht-Organisations-)Repos nicht verfügbar
      # (GitHub liefert dafür einen 500 statt einer sauberen Ablehnung).
      # SYNC_PUSH_TOKEN ist ein Fine-grained PAT von Alex (Repo-Owner) mit
      # "Contents: Read and write" — Owner-Pushes umgehen die PR-Pflicht
      # bereits (enforce_admins: false), also reicht dieser Identitätswechsel
      # ohne weitere Protection-Änderung.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PUSH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate rides.json
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY_2: ${{ secrets.INTERVALS_API_KEY_2 }}
          # Prod-Supabase (plan_cards, ftp_history) — ohne diese vier fehlt
          # der Sync-Umgebung jeder Zugriff auf die echte Datenbank, und
          # effectivePlan/ftpAt() fallen unbemerkt auf die eingefrorene
          # statische Plan+adjustments.json-Kombination bzw. DEFAULT_FTP
          # zurück (Degradationspfad, kein Fehler — deshalb lief das lange
          # unbemerkt, s. docs/offene-punkte.md). Nur Athlet 1 (eigener
          # Account) — für Athlet 2 existiert noch kein Prod-Zugang.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ATHLETE1_EMAIL: ${{ secrets.SUPABASE_ATHLETE1_EMAIL }}
          SUPABASE_ATHLETE1_PASSWORD: ${{ secrets.SUPABASE_ATHLETE1_PASSWORD }}
          # Athlet 4 ("Bentastiic"): volles Modell. Der Sync liest den
          # intervals.icu-Key aus der Supabase-Tabelle intervals_credentials
          # (vom Athleten in Settings eingetragen) — deshalb hier NUR der
          # Supabase-Login, kein INTERVALS_API_KEY_4. Fehlen diese beiden,
          # wird der Athlet-4-Block komplett übersprungen (kein Fehler).
          SUPABASE_ATHLETE4_EMAIL: ${{ secrets.SUPABASE_ATHLETE4_EMAIL }}
          SUPABASE_ATHLETE4_PASSWORD: ${{ secrets.SUPABASE_ATHLETE4_PASSWORD }}
          INTERVALS_ATHLETE_ID_2: ${{ secrets.INTERVALS_ATHLETE_ID_2 }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          WEATHER_LAT_2: ${{ secrets.WEATHER_LAT_2 }}
          WEATHER_LON_2: ${{ secrets.WEATHER_LON_2 }}
          WEATHER_LAT_4: ${{ secrets.WEATHER_LAT_4 }}
          WEATHER_LON_4: ${{ secrets.WEATHER_LON_4 }}
        run: node scripts/generate-data.js

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          # $GITHUB_REF_NAME statt hartkodiertem "main": diese Datei läuft
          # identisch auch bei einem manuellen workflow_dispatch auf
          # dashboard-2.0 (s. docs/offene-punkte.md, Infrastruktur/CI) —
          # ein hartkodiertes "main" würde dort Athlet-1-Produktivstände aus
          # main in den Dev-Branch ziehen und auf main statt dashboard-2.0
          # rebasen.
          git checkout "origin/$GITHUB_REF_NAME" -- data/adjustments.json data/subjective.json
          # adjustments-2.json (Athlet 2) existiert erst, sobald einmal committet —
          # git checkout würde ohne diesen Existenz-Check auf einem frischen Stand
          # fehlschlagen (Datei noch nicht im Remote-Branch vorhanden).
          git cat-file -e "origin/$GITHUB_REF_NAME:data/adjustments-2.json" 2>/dev/null && \
            git checkout "origin/$GITHUB_REF_NAME" -- data/adjustments-2.json
          git add data/rides.json data/adjustments.json data/subjective.json
          [ -f data/rides-2.json ] && git add data/rides-2.json
          [ -f data/adjustments-2.json ] && git add data/adjustments-2.json
          # interval-blocks.json (Blockerkennung-Cache, scripts/lib/interval-blocks.js):
          # wird von generate-data.js selbst geladen+ergänzt+geschrieben, kein
          # Browser-Schreibpfad wie bei adjustments/subjective -> kein
          # Schutz-Checkout nötig, einfaches Commit reicht.
          [ -f data/interval-blocks.json ] && git add data/interval-blocks.json
          git diff --staged --quiet || git commit -m "chore: update training data [skip ci]"
          # `exit 1` nach der Schleife, wenn kein Versuch durchkam (22.08.2026)
          # — zuvor lief dieser Schritt auch nach 3 gescheiterten Push-
          # Versuchen als "Erfolg" durch: die Schleife endete einfach, ohne
          # den Job fehlschlagen zu lassen. Genau das ließ die Branch-
          # Protection-Blockade (GH006, s. SYNC_PUSH_TOKEN-Kommentar oben)
          # tagelang unbemerkt — data/*.json fror auf altem Stand ein, ohne
          # dass ein einziger Sync-Lauf rot wurde. `pushed` als Wächter
          # macht einen künftigen Fehlschlag (abgelaufener Token, Netzwerk,
          # Rebase-Konflikt) wieder sichtbar, statt still zu verpuffen.
          pushed=false
          for i in 1 2 3; do
            git fetch origin
            git rebase "origin/$GITHUB_REF_NAME" && git push && { pushed=true; break; }
            echo "Push failed, retrying in 5s..."
            sleep 5
          done
          $pushed || { echo "::error::Push nach $GITHUB_REF_NAME fehlgeschlagen (3 Versuche) — data/*.json NICHT aktualisiert."; exit 1; }
