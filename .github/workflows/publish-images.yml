# Fahrplan 3, DKR4 — baut die drei eigenen Images (frontend, sync, migrate)
# und pusht sie versioniert nach GHCR. Postgres/GoTrue/PostgREST/Caddy werden
# NICHT hier veroeffentlicht — Tonys Infra (apps01) zieht diese direkt aus
# den offiziellen Registries, sein Update-Tooling (Renovate) verfolgt sie
# dort. s. docs/docker-lokal-einrichten.md.
#
# Trigger: Push nach main (aktualisiert den "latest"-Tag), "v*"-Tags
# (versionierte Releases, s. Uebergabepunkt in fahrplan-3-docker-umbau.md)
# und Pull Requests (nur Bauen, kein Push — faengt ein kaputtes Dockerfile
# vor dem Merge ab). Nach dem ersten erfolgreichen Lauf je Image muss die
# Sichtbarkeit einmalig manuell auf "Public" gestellt werden (GitHub-Profil
# -> Packages) — private Pakete sind vom Server aus sonst nicht ziehbar.
name: publish-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  # "paths" bewusst nur hier, nicht bei "push": Tag-Pushes verhalten sich mit
  # "paths"-Filtern unzuverlaessig (kein verlaesslicher Diff-Referenzpunkt),
  # ein Versions-Tag soll aber IMMER den Publish ausloesen. Bei PRs dagegen
  # soll ein reiner Doku-Commit (wie dieser) keine drei Docker-Builds
  # anstossen — analog zu ci-app.yml's "app/**"-Filter.
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/stuhlsen/training-dashboard-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/stuhlsen/training-dashboard-sync
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/stuhlsen/training-dashboard-migrate
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./supabase
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Erstellt bei einem "v*"-Tag ein GitHub Release mit automatisch aus den
  # Commits generierten Notizen — sonst sieht Renovate bei MRs nur nackte
  # Vergleichs-Links statt einer Changelog (Issue #7).
  release:
    needs: [frontend, sync, migrate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
