# Fahrplan 3, DKR4 — baut die drei eigenen Images (frontend, sync, migrate)
# und pusht sie versioniert nach GHCR. Postgres/GoTrue/PostgREST/Caddy werden
# NICHT hier veroeffentlicht — Tonys Infra (apps01) zieht diese direkt aus
# den offiziellen Registries, sein Update-Tooling (Renovate) verfolgt sie
# dort. s. docs/docker-lokal-einrichten.md.
#
# Trigger: Push nach main (aktualisiert den "latest"-Tag), "v*"-Tags
# (versionierte Releases, s. Uebergabepunkt in fahrplan-3-docker-umbau.md)
# und Pull Requests (nur Bauen, kein Push — faengt ein kaputtes Dockerfile
# vor dem Merge ab). Nach dem ersten erfolgreichen Lauf je Image muss die
# Sichtbarkeit einmalig manuell auf "Public" gestellt werden (GitHub-Profil
# -> Packages) — private Pakete sind vom Server aus sonst nicht ziehbar.
name: publish-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  # "paths" bewusst nur hier, nicht bei "push": Tag-Pushes verhalten sich mit
  # "paths"-Filtern unzuverlaessig (kein verlaesslicher Diff-Referenzpunkt),
  # ein Versions-Tag soll aber IMMER den Publish ausloesen. Bei PRs dagegen
  # soll ein reiner Doku-Commit (wie dieser) keine drei Docker-Builds
  # anstossen — analog zu ci-app.yml's "app/**"-Filter.
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/stuhlsen/training-dashboard-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/stuhlsen/training-dashboard-sync
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/stuhlsen/training-dashboard-migrate
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ./supabase
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Erstellt bei einem "v*"-Tag ein GitHub Release mit nach Commit-Typ
  # gruppierten Notizen (fix:/feat:/design:/docs:/chore:/test: — s.
  # Commit-Konvention in AGENTS.md) statt der nackten Vergleichs-Links von
  # "gh release create --generate-notes" (das gruppiert nur nach PR-Labels,
  # dieses Repo nutzt aber keine PRs). Vorbild: netbird-Releases
  # (github.com/netbirdio/netbird/releases) — dort nach Bereich gruppiert
  # mit einem lesbaren Satz je Änderung; hier nach Commit-Typ, da es
  # thematische Bereiche wie dort nicht gibt.
  release:
    needs: [frontend, sync, migrate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release Notes generieren
        run: |
          declare -A SECTION_TITLES=(
            [feat]="Features" [fix]="Fixes" [design]="Design"
            [docs]="Docs" [chore]="Chores" [test]="Tests"
          )
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 -x "$GITHUB_REF_NAME" | tail -n1)
          if [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then PREV_TAG=""; fi
          RANGE="${PREV_TAG:+$PREV_TAG..}$GITHUB_REF_NAME"

          {
            for type in feat fix design docs chore test; do
              LINES=$(git log "$RANGE" --pretty=format:"%s" \
                | grep -v '^Merge ' \
                | grep -v '^chore: update training data' \
                | grep "^${type}: " || true)
              if [ -n "$LINES" ]; then
                echo "### ${SECTION_TITLES[$type]}"
                echo ""
                echo "$LINES" | sed -E "s/^${type}: (.*)/- \1/"
                echo ""
              fi
            done
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

      - run: gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
