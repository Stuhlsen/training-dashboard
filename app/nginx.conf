server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # config.json wird bei jedem Containerstart neu geschrieben — nie cachen,
    # und wegen der winzigen Groesse auch nicht gzippen (Overhead > Nutzen)
    location = /config.json {
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # gehashte Assets duerfen lange gecacht werden
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # data/*.json kommt aus dem vom Sync-Container beschriebenen Volume
    # (Fahrplan 3, DKR2) — fehlt eine Datei (noch kein Sync gelaufen, oder
    # gerade mitten im Schreiben), muss ein echtes 404 zurueckkommen statt
    # der SPA-Fallback unten: sonst liefert nginx index.html mit
    # Content-Type text/html, und das Frontend scheitert undurchsichtig an
    # JSON.parse() statt sauber "keine Daten" zu erkennen.
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
