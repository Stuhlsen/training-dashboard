# Fahrplan 3, DKR3 — Self-Host-Stack lokal (Postgres, GoTrue, PostgREST, Proxy).
# Gilt ausschliesslich fuer den eigenen Rechner, s. docs/docker-lokal-einrichten.md
# Abschnitt 3. Die Server-Fassung (docker-compose.prod.yml) entsteht erst in DKR4.

services:
  postgres:
    image: supabase/postgres:17.6.1.171
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # KEIN "ports:" hier — von aussen absichtlich nicht erreichbar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # supabase/postgres legt "authenticator"/"supabase_auth_admin" mit einem
  # eigenen, von POSTGRES_PASSWORD unabhaengigen Passwort an — PostgREST/
  # GoTrue koennen sich damit nicht verbinden (empirisch ermittelt: erst
  # "password authentication failed for user authenticator", dann nach
  # Korrektur "relation identities does not exist" fuer den GoTrue-Connect
  # ueber den falschen Postgres-User statt supabase_auth_admin). Dieser
  # Schritt setzt fuer beide Rollen eigene Passwoerter
  # (AUTHENTICATOR_PASSWORD / AUTH_ADMIN_PASSWORD), bevor gotrue/postgrest
  # starten - bewusst NICHT POSTGRES_PASSWORD: die Superuser-Credentials
  # haben in den Verbindungs-URIs von gotrue/postgrest nichts verloren,
  # ein Leak dort soll nicht die ganze DB aufmachen.
  #
  # Zusaetzlich: das Image setzt eigene ALTER-DEFAULT-PRIVILEGES fuer
  # anon/authenticated/service_role, die neu angelegten Tabellen im
  # public-Schema automatisch ALLE Rechte geben — das hebelt die
  # feingranularen GRANTs aus supabase/migrations/0002_grants.sql aus
  # (empirisch ermittelt: tests/supabase-rls.test.js zeigte "anon darf X
  # nicht lesen (kein GRANT)" als false, obwohl 0002 kein SELECT fuer anon
  # auf diese Tabellen vorsieht). Deshalb REVOKE, bevor "migrate" die
  # Tabellen anlegt — die anschliessenden Migrationen vergeben die Rechte
  # dann exklusiv selbst.
  # Das letzte "REVOKE authenticator FROM postgres" unten ist Tonys Fund beim
  # apps01-Rollout (Fahrplan 16 E10, 2026-09-22): das supabase/postgres-Image
  # seedet beim ersten Boot schon einen Teil des storage-Schemas (Rollen/
  # Grants, storage-api-Migrationen 0-1) inkl. "GRANT authenticator TO
  # postgres". storage-api's eigene Migration 2 versucht die umgekehrte
  # Richtung ("GRANT postgres TO authenticator") — Postgres verweigert das als
  # Rollenmitgliedschafts-Zyklus, storage-api crash-loopt beim ersten Start.
  # Das REVOKE muss hier stehen, VOR storage-init.
  db-init:
    image: supabase/postgres:17.6.1.171
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
    entrypoint: ["bash", "-c"]
    command:
      - >
        psql -h postgres -U supabase_admin -d postgres -c
        "ALTER ROLE authenticator WITH PASSWORD '$$AUTHENTICATOR_PASSWORD' LOGIN;" &&
        psql -h postgres -U supabase_admin -d postgres -c
        "ALTER ROLE supabase_auth_admin WITH PASSWORD '$$AUTH_ADMIN_PASSWORD';" &&
        psql -h postgres -U supabase_admin -d postgres -c
        "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated, service_role;" &&
        psql -h postgres -U supabase_admin -d postgres -c
        "GRANT ALL ON SCHEMA storage TO postgres, supabase_storage_admin; GRANT ALL ON ALL TABLES IN SCHEMA storage TO postgres, supabase_storage_admin;" &&
        psql -h postgres -U supabase_admin -d postgres -c
        "REVOKE authenticator FROM postgres;"

  # Storage-Schema vor dbmate-Migrationen anlegen
  storage-init:
    image: supabase/storage-api:v1.79.14
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # supabase_admin, nicht postgres — postgres ist in diesem Image KEIN
      # Superuser (supabase_admin ist es), mit postgres schlagen storage-api's
      # DB_INSTALL_ROLES-Migrationen mit "permission denied for schema storage"
      # fehl (Tonys Fund, s. o.).
      DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
    entrypoint: ["node", "dist/scripts/migrate-call.js"]

  # Fahrplan 3, DKR4: eigenes Image (supabase/Dockerfile) statt Bind-Mount —
  # das ist das Artefakt, das zusammen mit dem Frontend versioniert nach
  # GHCR geht (Tonys Vorgabe: kein Host-Pfad auf apps01, s. docs/docker-lokal-einrichten.md).
  migrate:
    build:
      context: ./supabase
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable

  gotrue:
    image: supabase/gotrue:v2.197.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      GOTRUE_DB_DRIVER: postgres
      # supabase_auth_admin, nicht postgres — dessen search_path ist auf das
      # auth-Schema vorkonfiguriert (Owner von auth.users/identities/…).
      # Mit dem postgres-User loeste GoTrue unqualifizierte Tabellennamen
      # (z.B. "identities") nicht auf ("relation does not exist"), empirisch
      # ermittelt beim ersten lokalen DKR3-Testlauf.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD}@postgres:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: http://localhost:8080
      GOTRUE_URI_ALLOW_LIST: http://localhost:8080
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      API_EXTERNAL_URL: http://localhost/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    healthcheck:
      # Port 8081, nicht das oft dokumentierte 9999 — empirisch aus dem
      # Log dieses Images ermittelt ("GoTrue API started on: :8081").
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v16.3
    depends_on:
      migrate:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    # Kein Healthcheck moeglich: das Image hat weder Shell noch wget/curl
    # (nur die statische postgrest-Binary), ein exec-basierter Check
    # scheitert daran ("executable file not found in $PATH"), empirisch
    # geprueft. PostgREST verbindet sich laut Log aber binnen ~1-2s nach
    # dem Start mit Postgres — die verbleibende Race gegen "proxy" ist klein
    # und aeussert sich hoechstens als einzelner transienter 502 direkt
    # nach "up -d", nicht als dauerhafter Fehlzustand.

  # Fahrplan 15, E2 — Admin-Pruefung (V2) gegen PostgREST, Invite noch Stub.
  admin-api:
    build:
      context: ./admin-api
    depends_on:
      postgrest:
        condition: service_started
      gotrue:
        condition: service_healthy
    environment:
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      POSTGREST_INTERNAL_URL: http://postgrest:3000
      GOTRUE_INTERNAL_URL: http://gotrue:8081
      # Lokaler service_role-JWT (signiert mit demselben JWT_SECRET wie
      # gotrue/postgrest), per "node scripts/generate-jwt-keys.js" erzeugt
      # und in die eigene .env kopiert — eigene Variable, NICHT die
      # SUPABASE_SERVICE_ROLE_KEY aus .env (die gehoert dem Cloud-Projekt
      # dashboard-dev und ist mit dessen eigenem Secret signiert).
      SUPABASE_SERVICE_ROLE_KEY: ${SELFHOST_SERVICE_ROLE_KEY}
    # KEIN "ports:" hier — von aussen nur ueber den Proxy erreichbar (wie postgres)

  # Fahrplan 16, E1 — Supabase Storage API fuer Bikefit-Fotos (und spaetere Medien)
  # v1.79.12 — Version wie auf apps01 (Tony, 2026-09-22): der urspruengliche
  # v1.16.0-Pin war ungewollt veraltet (Jan. 2025, ~58 Releases zurueck),
  # keine bewusste Festlegung auf die alte Version.
  storage-api:
    image: supabase/storage-api:v1.79.14
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummy}
      SERVICE_KEY: ${SELFHOST_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://postgrest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # supabase_admin statt postgres — s. Kommentar bei storage-init oben.
      DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
      UPLOAD_FILE_SIZE_LIMIT: "15728640" # 15MB
      STORAGE_BACKEND: file
      STORAGE_FILE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: default
      REGION: local
      GLOBAL_S3_BUCKET: bikefit-photos
      IMAGE_TRANSFORMATION_ENABLED: "false"
    volumes:
      - storage_data:/var/lib/storage
    # KEIN "ports:" hier — von aussen nur ueber den Proxy erreichbar

  proxy:
    image: caddy:2.11-alpine
    depends_on:
      gotrue:
        condition: service_healthy
      postgrest:
        condition: service_started
      admin-api:
        condition: service_started
      storage-api:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile

volumes:
  pgdata:
  storage_data:
